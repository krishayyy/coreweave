<!doctype html>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Search Loop</title>
<link rel="stylesheet" href="src/style.css" />

<div id="app">
  <main id="stage">
    <section class="pane" id="paneA"><canvas class="map"></canvas></section>
    <section class="pane" id="paneB">
      <canvas class="map"></canvas>
      <div class="revising"><span>PREMISE FAILING</span></div>
    </section>
    <div class="panelabel" id="labelA">Conventional search</div>
    <div class="panesub">optimises inside its assumption</div>
    <div class="panelabel right" id="labelB">This system</div>
    <div class="panesub right">can abandon the assumption</div>
    <div class="verdict" id="verdictA"></div>
    <div class="verdict right" id="verdictB"></div>
  </main>

  <header id="bar" class="float">
    <span id="op">—</span>
    <span class="sep"></span>
    <span id="subject">—</span>
    <span class="spacer"></span>
    <span id="elapsed">—</span>
    <span class="sep"></span>
    <span id="status">STANDBY</span>
    <span id="clock">P00</span>
  </header>

  <aside id="side" class="float">
    <h2>Cases</h2>
    <div id="cases" role="listbox" aria-label="Cases"></div>
    <h2 class="spaced">Operational log</h2>
    <ol id="log" aria-live="polite"></ol>
  </aside>

  <footer id="deck" class="float">
    <div id="readout">
      <div class="metric"><span class="k">subject was</span><span class="v num" id="mDist">—</span></div>
      <div class="metric"><span class="k">conventional</span><span class="v dim num" id="mConv">—</span></div>
      <div class="metric"><span class="k">this system</span><span class="v warm num" id="mOurs">—</span></div>
      <div class="metric"><span class="k">found sooner by</span><span class="v warm num" id="mSaved">—</span></div>
    </div>
    <div id="graphwrap">
      <canvas id="graph"></canvas>
      <div class="glabel">percentile rank of the subject&rsquo;s actual location, by operational period</div>
    </div>
  </footer>
</div>
<script type="module" src="src/main.js"></script>
